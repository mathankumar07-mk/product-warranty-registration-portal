# NOTE: the PostgreSQL database (product_warranty_db) already exists in the
# Render dashboard, so this blueprint does not create one. Set DATABASE_URL
# in the dashboard to the INTERNAL Database URL for the Render web service:
# postgresql://product_warranty_db_user:<password>@dpg-db6aivqd0e5s73a18fjg-a/product_warranty_db
services:
  - type: web
    name: product-warranty-registration-portal
    runtime: python
    repo: https://github.com/mathankumar07-mk/product-warranty-registration-portal.git
    branch: main
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: APP_NAME
        value: Product Warranty Registration Portal
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: ENVIRONMENT
        value: production
      - key: SESSION_COOKIE
        value: warranty_session
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: INITIAL_ADMIN_EMAIL
        sync: false
